name: Server Docker Single
# Server Linux already tests and packages its freshly built single-container image.
# This manual workflow is a focused recheck of the current source.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-docker-single-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Build the current source image
        run: |
          set -euo pipefail
          for script in packaging/server/docker-single/*.sh; do bash -n "$script"; done
          shellcheck packaging/server/docker-single/*.sh
          docker build -t h-live-server:0.1.1 -f packaging/server/Dockerfile .
      - name: Single application container lifecycle
        env:
          H_LIVE_EPHEMERAL_CI: '1'
        run: bash packaging/server/docker-single/smoke.sh
