[package]
name = "h-live-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = ["dep:flate2"]

[dependencies]
qingkan-core = { path = "../qingkan-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "socks", "gzip"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-socks = "0.5"
futures-util = { version = "0.3", features = ["sink"] }
url = "2"
regex = "1"
md-5 = "0.10"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
percent-encoding = "2"
csv = "1"
flate2 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
rusqlite.workspace = true
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }


[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
