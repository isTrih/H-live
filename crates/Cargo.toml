[workspace]
members = ["qingkan-core", "h-live-runtime", "h-live-server"]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "=0.4.45"
thiserror = "=2.0.21"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
crossbeam-channel = "=0.5.17"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
tempfile = "=3.27.0"
flate2 = "=1.1.10"
prost = "=0.14.4"
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.25"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
